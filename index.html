<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Marco Akl — CS student and aspiring cybersecurity specialist. Portfolio of projects, skills, and contact info."
    />
    <title>Marco Akl — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static form so Netlify's build bot can detect the fields; the real UI lives in Note.jsx -->
    <form name="leave-a-note" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
